[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hami-tail-pilot"
version = "0.1.0"
description = "Reproducible HAMi quota tail-latency pilot harness"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hami-tail-pilot = "hami_tail_pilot.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

